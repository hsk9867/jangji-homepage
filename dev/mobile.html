<!doctype html><meta charset="utf-8"><title>모바일 미리보기</title>
<style>body{margin:0;background:#555;display:flex;gap:20px;padding:16px;align-items:flex-start}iframe{width:390px;height:800px;border:0;background:#fff;border-radius:18px}input{width:380px}</style>
<div><input id="u" value="/"><br><iframe id="f" src="/"></iframe></div>
<script>u.onchange=()=>f.src=u.value;var q=new URLSearchParams(location.search).get('p');if(q){u.value=q;f.src=q}</script>
