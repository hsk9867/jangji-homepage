<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>관리자</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root { --g: #2f5d50; --gd: #22463c; --gs: #e6eee9; --bg: #f3f1ec; --line: #ddd6ca; --ink: #1f2a26; --ink2: #5a6560; --red: #b3261e; --warm: #a8652e; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Pretendard, -apple-system, "Malgun Gothic", sans-serif; font-size: 16px; line-height: 1.55; word-break: keep-all; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
a { color: var(--g); }
.hidden { display: none !important; }
.top { position: sticky; top: 0; z-index: 20; background: var(--gd); color: #fff; }
.top .in { max-width: 980px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.top b { font-size: 17px; }
.top a, .top button { color: #fff; background: rgba(255,255,255,.14); border: 0; border-radius: 8px; padding: 6px 10px; font-size: 14px; text-decoration: none; }
.top .sp { margin-left: auto; }
.tabs { position: sticky; top: 50px; z-index: 19; background: #fff; border-bottom: 1px solid var(--line); overflow-x: auto; white-space: nowrap; }
.tabs .in { max-width: 980px; margin: 0 auto; padding: 0 8px; display: flex; }
.tabs button { border: 0; background: none; padding: 13px 14px; font-weight: 700; color: var(--ink2); border-bottom: 3px solid transparent; position: relative; }
.tabs button.on { color: var(--gd); border-bottom-color: var(--g); }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--red); color: #fff; font-size: 12px; line-height: 20px; text-align: center; margin-left: 4px; }
main { max-width: 980px; margin: 0 auto; padding: 18px 16px 120px; }
h2 { font-size: 20px; margin: 0 0 4px; }
.help { color: var(--ink2); font-size: 14px; margin: 0 0 16px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.card h3 { margin: 0 0 12px; font-size: 17px; }
.f { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.f > label { font-weight: 700; font-size: 15px; }
.f small { color: var(--ink2); font-size: 13px; }
.f input[type=text], .f input[type=tel], .f input[type=email], .f input[type=url], .f input[type=date], .f input[type=password], .f select, .f textarea { padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; width: 100%; }
.f textarea { min-height: 96px; resize: vertical; }
.f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: var(--g); }
.row2 { display: grid; gap: 0 12px; }
@media (min-width: 720px) { .row2 { grid-template-columns: 1fr 1fr; } }
.chk { display: flex; align-items: center; gap: 8px; font-weight: 600; margin: 4px 16px 10px 0; }
.chk input { width: 20px; height: 20px; accent-color: var(--g); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1.5px solid var(--g); background: #fff; color: var(--gd); font-weight: 700; }
.btn.pri { background: var(--g); color: #fff; }
.btn.del { border-color: #e2b4b0; color: var(--red); }
.btn.del.arm { background: var(--red); color: #fff; border-color: var(--red); }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: 14px; border-radius: 8px; }
.btn:disabled { opacity: .5; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 13px; font-weight: 600; font-size: 14px; color: var(--ink2); }
.chip.on { background: var(--g); border-color: var(--g); color: #fff; }
.list { display: grid; gap: 10px; }
.item { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.item .th { width: 76px; height: 58px; border-radius: 8px; background: #e9e4da center/cover; flex: none; }
.item .tx { flex: 1; min-width: 0; }
.item .tx b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .tx small { color: var(--ink2); font-size: 13px; }
.lb { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 999px; margin-right: 4px; background: var(--gs); color: var(--gd); }
.lb.hide { background: #eee; color: #777; }
.lb.sample { background: #fff1d6; color: #8a5a00; }
.lb.star { background: #f6e9dc; color: var(--warm); }
.empty { padding: 28px; text-align: center; color: var(--ink2); background: #fff; border: 1px dashed var(--line); border-radius: 12px; }
/* 편집 패널 */
.panel { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4); display: flex; justify-content: flex-end; }
.panel .in { width: min(640px, 100%); height: 100%; background: var(--bg); overflow-y: auto; padding: 0 0 100px; }
.panel .ph { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
.panel .ph b { font-size: 17px; flex: 1; }
.panel .bd { padding: 16px; }
.panel .ft { position: fixed; bottom: 0; right: 0; width: min(640px, 100%); background: #fff; border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; }
.panel .ft .pri { flex: 1; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.photos .p { position: relative; aspect-ratio: 4/3; border-radius: 8px; background: #ddd center/cover; overflow: hidden; }
.photos .p .ctl { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; background: rgba(0,0,0,.5); }
.photos .p .ctl button { border: 0; background: none; color: #fff; padding: 4px 8px; font-size: 14px; }
.photos .p .first { position: absolute; left: 4px; top: 4px; background: var(--g); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 6px; }
.photos .add { aspect-ratio: 4/3; border: 2px dashed var(--line); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink2); font-size: 14px; font-weight: 600; background: #fff; cursor: pointer; }
.photos .add input { display: none; }
.prog { font-size: 14px; color: var(--warm); margin-top: 6px; }
.pairs .pair { background: #faf8f4; border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; display: grid; gap: 6px; }
.pairs .pair input, .pairs .pair textarea { padding: 9px 10px; border: 1.5px solid var(--line); border-radius: 8px; width: 100%; background: #fff; }
.pairs .pair textarea { min-height: 64px; }
.pairs .pair .x { justify-self: end; }
/* 저장 바 */
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.savebar .in { max-width: 980px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
.savebar .msg { flex: 1; font-size: 14px; color: var(--ink2); }
.savebar .msg.dirty { color: var(--warm); font-weight: 700; }
.toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; z-index: 99; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
.toast.err { background: var(--red); }
/* 문의 */
.inq { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.inq.new { border-left: 5px solid var(--red); }
.inq .hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.inq .hd b { font-size: 18px; }
.inq .hd a { font-weight: 800; font-size: 17px; text-decoration: none; }
.inq .hd time { margin-left: auto; color: var(--ink2); font-size: 13px; }
.inq .meta { margin: 6px 0; color: var(--ink2); font-size: 14px; }
.inq .memo { background: #faf8f4; border-radius: 8px; padding: 8px 10px; white-space: pre-line; font-size: 15px; margin: 6px 0; }
.inq .ctl { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.inq .ctl select, .inq .ctl input { padding: 7px 9px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; }
.inq .ctl input { flex: 1; min-width: 160px; }
/* 로그인 */
.login { max-width: 380px; margin: 12vh auto 0; padding: 0 16px; }
.login .card { padding: 24px; }
.login h1 { font-size: 22px; margin: 0 0 6px; }
.err { color: var(--red); font-size: 14px; min-height: 1.2em; margin-top: 8px; }
.warn { background: #fff4d6; color: #6b4e00; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
</style>
</head>
<body>
<div id="login" class="login hidden">
  <div class="card">
    <h1 id="lg-title">관리자 로그인</h1>
    <p class="help" id="lg-help">비밀번호를 입력하세요.</p>
    <div class="f"><label for="lg-pw">비밀번호</label><input type="password" id="lg-pw" autocomplete="current-password"></div>
    <div class="f hidden" id="lg-pw2-wrap"><label for="lg-pw2">비밀번호 확인</label><input type="password" id="lg-pw2" autocomplete="new-password"></div>
    <button class="btn pri" id="lg-btn" style="width:100%">로그인</button>
    <div class="err" id="lg-err"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="top"><div class="in"><b id="top-name">관리자</b><span class="sp"></span><a href="./" target="_blank" rel="noopener">사이트 보기</a><button id="logout">로그아웃</button></div></div>
  <div class="tabs"><div class="in" id="tabs">
    <button data-tab="inbox">문의 접수<span class="badge hidden" id="new-count">0</span></button>
    <button data-tab="facilities">답사 시설</button>
    <button data-tab="reviews">고객 후기</button>
    <button data-tab="types">장지 안내</button>
    <button data-tab="site">기본 정보</button>
    <button data-tab="settings">설정</button>
  </div></div>
  <main id="view"></main>
  <div class="savebar hidden" id="savebar"><div class="in"><span class="msg" id="save-msg">변경 사항이 없습니다.</span><button class="btn" id="preview">미리보기</button><button class="btn pri" id="save">저장하기</button></div></div>
</div>

<script src="js/blog-content.js"></script>
<script src="js/defaults.js"></script>
<script>document.write('<script src="data/content.js?t=' + Date.now() + '"><\/script>');</script>
<script src="js/admin.js"></script>
</body>
</html>
